<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - by S4NZz</title>
    
    <style>
        /* Pengaturan Dasar */
        :root {
            --warna-batu: #d4a373;
            --warna-kertas: #a9d6e5;
            --warna-gunting: #f08080;
            --warna-latar: #f4f1de;
            --warna-teks: #3d405b;
            --warna-menang: #2a9d8f;
            --warna-kalah: #e76f51;
            --warna-seri: #8390b1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--warna-latar);
            color: var(--warna-teks);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

        main {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: var(--warna-teks);
            margin-top: 0;
        }

        /* 1. Papan Skor (Total Score) */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 1rem;
        }

        .score-display {
            width: 100px;
            padding: 0.5rem;
            border-radius: 8px;
        }

        #player-score-display {
            background-color: #e0f2fe;
            border-bottom: 5px solid #3c_a2f6;
        }

        #computer-score-display {
            background-color: #fee2e2;
            border-bottom: 5px solid #ef4444;
        }

        .scoreboard span {
            display: block;
            font-size: 2.5rem;
            font-weight: 700;
        }

        #player-label { color: #3c_a2f6; }
        #computer-label { color: #ef4444; }


        /* 2. Pilihan Pemain (Visual Menarik) */
        .choices {
            display: flex;
            justify-content: center;
            gap: 1.5rem; /* Jarak antar tombol */
            margin-bottom: 2rem;
        }

        .choice-btn {
            font-size: 3rem; /* Ukuran emoji besar */
            padding: 1rem;
            border: none;
            border-radius: 50%; /* Membuat tombol bulat */
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .choice-btn:hover {
            transform: scale(1.1); /* Efek zoom saat di-hover */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        /* Warna spesifik untuk tiap tombol */
        #batu { background-color: var(--warna-batu); }
        #gunting { background-color: var(--warna-gunting); }
        #kertas { background-color: var(--warna-kertas); }

        /* 3. Hasil Pertandingan (Tambahan Menarik) */
        .result-container {
            min-height: 150px; /* Jaga ketinggian agar tidak "loncat" */
        }

        #result-message {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            min-height: 1.5em; /* Ketinggian minimum untuk pesan */
        }
        
        /* Ini adalah bagian tambahan menarik */
        .picks-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            font-size: 1.2rem;
            opacity: 0; /* Sembunyikan di awal */
            transition: opacity 0.5s ease;
        }
        
        /* Akan di-set ke 1 via JS saat ada hasil */
        .picks-display.visible {
            opacity: 1;
        }

        .pick {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 4px solid transparent;
            padding: 1rem;
            border-radius: 10px;
            min-width: 120px;
        }
        
        .pick span {
            font-size: 3rem; /* Emoji hasil */
            margin-top: 0.5rem;
        }
        
        /* CSS Tambahan: Border Menang/Kalah/Seri */
        .pick.win { border-color: var(--warna-menang); }
        .pick.lose { border-color: var(--warna-kalah); }
        .pick.draw { border-color: var(--warna-seri); }


        /* 4. Tombol Reset */
        .reset-container {
            margin-top: 2rem;
        }

        #reset-btn {
            background-color: var(--warna-teks);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #reset-btn:hover {
            background-color: #5a5f8a;
        }

    </style>
</head>
<body>

    <main>
        <h1>GAME - Gunting Batu Kertas</h1>

        <section class="scoreboard">
            <div class="score-display" id="player-score-display">
                <div id="player-label">Anda</div>
                <span id="player-score">0</span>
            </div>
            <div class="score-display" id="computer-score-display">
                <div id="computer-label">Komputer</div>
                <span id="computer-score">0</span>
            </div>
        </section>

        <section>
            <h2>Pilih Jagoanmu:</h2>
            <div class="choices">
                <button class="choice-btn" id="batu" data-choice="batu">✊</button>
                <button class="choice-btn" id="gunting" data-choice="gunting">✌️</button>
                <button class="choice-btn" id="kertas" data-choice="kertas">✋</button>
            </div>
        </section>

        <section class="result-container">
            <h3 id="result-message">Mulai Permainan!</h3>
            
            <div class="picks-display" id="picks-display">
                <div class="pick" id="player-pick">
                    <strong>Anda</strong>
                    <span id="player-pick-emoji">❓</span>
                </div>
                <div class="pick" id="computer-pick">
                    <strong>Komputer</strong>
                    <span id="computer-pick-emoji">🤖</span>
                </div>
            </div>
        </section>

        <section class="reset-container">
            <button id="reset-btn">Reset Skor</button>
        </section>
    </main>

    <script>
        // 1. Inisialisasi Variabel dan Elemen DOM
        let playerScore = 0;
        let computerScore = 0;
        const choices = ['batu', 'gunting', 'kertas'];
        
        // Mapping untuk emoji
        const emojiMap = {
            batu: '✊',
            gunting: '✌️',
            kertas: '✋'
        };

        // Elemen Skor
        const playerScoreEl = document.getElementById('player-score');
        const computerScoreEl = document.getElementById('computer-score');

        // Elemen Pilihan
        const choiceButtons = document.querySelectorAll('.choice-btn');
        
        // Elemen Hasil
        const resultMessageEl = document.getElementById('result-message');
        const picksDisplayEl = document.getElementById('picks-display');
        const playerPickEl = document.getElementById('player-pick');
        const computerPickEl = document.getElementById('computer-pick');
        const playerPickEmojiEl = document.getElementById('player-pick-emoji');
        const computerPickEmojiEl = document.getElementById('computer-pick-emoji');

        // Elemen Reset
        const resetBtn = document.getElementById('reset-btn');

        // 2. Fungsi Utama Game
        function playGame(playerChoice) {
            // Dapatkan pilihan komputer
            const computerChoice = getComputerChoice();
            
            // Tentukan pemenangnya
            const result = getResult(playerChoice, computerChoice);
            
            // Update skor
            updateScore(result);
            
            // Tampilkan hasil di UI
            updateUI(result, playerChoice, computerChoice);
        }

        // 3. Fungsi Bantu
        
        // Mendapatkan pilihan acak komputer
        function getComputerChoice() {
            const randomIndex = Math.floor(Math.random() * choices.length);
            return choices[randomIndex];
        }

        // Menentukan pemenang (logika kondisional)
        function getResult(player, computer) {
            if (player === computer) {
                return 'draw'; // Seri
            }
            
            if (
                (player === 'batu' && computer === 'gunting') ||
                (player === 'gunting' && computer === 'kertas') ||
                (player === 'kertas' && computer === 'batu')
            ) {
                return 'win'; // Pemain menang
            }
            
            return 'lose'; // Pemain kalah
        }

        // Update variabel skor
        function updateScore(result) {
            if (result === 'win') {
                playerScore++;
            } else if (result === 'lose') {
                computerScore++;
            }
        }

        // Update tampilan (UI)
        function updateUI(result, playerChoice, computerChoice) {
            // Update Teks Skor
            playerScoreEl.textContent = playerScore;
            computerScoreEl.textContent = computerScore;

            // Update Tampilan Pilihan (Tambahan Menarik)
            playerPickEmojiEl.textContent = emojiMap[playerChoice];
            computerPickEmojiEl.textContent = emojiMap[computerChoice];
            picksDisplayEl.classList.add('visible'); // Tampilkan box pilihan

            // Hapus kelas hasil sebelumnya
            playerPickEl.className = 'pick';
            computerPickEl.className = 'pick';

            // Update Pesan Hasil dan tambahkan border (Tambahan Menarik)
            if (result === 'win') {
                resultMessageEl.textContent = `Anda Menang! ${capitalize(playerChoice)} mengalahkan ${computerChoice}.`;
                resultMessageEl.style.color = 'var(--warna-menang)';
                playerPickEl.classList.add('win'); // Tambah border hijau
                computerPickEl.classList.add('lose'); // Tambah border merah
            } else if (result === 'lose') {
                resultMessageEl.textContent = `Anda Kalah! ${capitalize(computerChoice)} mengalahkan ${playerChoice}.`;
                resultMessageEl.style.color = 'var(--warna-kalah)';
                playerPickEl.classList.add('lose');
                computerPickEl.classList.add('win');
            } else {
                resultMessageEl.textContent = "Hasilnya Seri!";
                resultMessageEl.style.color = 'var(--warna-seri)';
                playerPickEl.classList.add('draw'); // Tambah border abu-abu
                computerPickEl.classList.add('draw');
            }
        }

        // Fungsi untuk Reset Game
        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            
            // Reset UI Skor
            playerScoreEl.textContent = '0';
            computerScoreEl.textContent = '0';
            
            // Reset Pesan
            resultMessageEl.textContent = 'Mulai Permainan!';
            resultMessageEl.style.color = 'var(--warna-teks)';
            
            // Reset Tampilan Pilihan
            picksDisplayEl.classList.remove('visible');
            playerPickEmojiEl.textContent = '❓';
            computerPickEmojiEl.textContent = '🤖';
            playerPickEl.className = 'pick';
            computerPickEl.className = 'pick';
        }
        
        // Fungsi utilitas kecil
        function capitalize(word) {
            return word.charAt(0).toUpperCase() + word.slice(1);
        }

        // 4. Event Listeners
        
        // Tambahkan listener untuk setiap tombol pilihan
        choiceButtons.forEach(button => {
            button.addEventListener('click', () => {
                const choice = button.dataset.choice;
                playGame(choice);
            });
        });

        // Tambahkan listener untuk tombol reset
        resetBtn.addEventListener('click', resetGame);
        
    </script>

</body>
</html>
